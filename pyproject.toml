[project]
name = "rsnaknee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — multilingual report extraction + efficient MIL over MRI series"
requires-python = ">=3.12"
dependencies = [
    # data
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "iterative-stratification>=0.1.9",
    # imaging
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.4",
    "python-gdcm>=3.0",
    "opencv-python-headless>=4.10",
    # modelling
    "torch>=2.6",
    "timm>=1.0",
    # reports / multilingual NLP
    "lingua-language-detector>=2.0",
    "regex>=2024.5",
    # tooling
    "tqdm>=4.66",
    "pytest>=8.0",
    # Needed to fetch the competition CSVs and the pixel cache built by the Kaggle notebook,
    # so it belongs in the project rather than relying on a system-wide install.
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsnaknee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
